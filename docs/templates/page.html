{% include "header.html" %}
{% include "nav.html" %}
<div class="docs-container">
  {% include "sidebar.html" %}
  <main class="docs-main{% if not page.toc %} no-toc{% endif %}">
    <h1>{{ page.title }}</h1>
    {{ content }}
    <footer class="docs-footer">
      <div class="footer-mark">
        <a href="https://www.hahwul.com" target="_blank" rel="noopener" aria-label="hahwul">
          <span class="hahwul-img" role="img" aria-label="hahwul"></span>
        </a>
        <p class="footer-love">Built with Love</p>
      </div>
    </footer>
  </main>
  {% if page.toc %}
  <aside class="docs-toc">
    <div class="toc-title">On this page</div>
    {{ toc }}
  </aside>
  {% endif %}
</div>
{% include "footer.html" %}
